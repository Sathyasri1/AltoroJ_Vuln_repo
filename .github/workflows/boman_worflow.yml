# This is a basic workflow to help you get started with boman.ai

name: Bomanai Scanner
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ AltoroJ-3.2 ]
  pull_request:
    branches: [ AltoroJ-3.2 ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  Boman-scan:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      # Runs a single command using the runners shell
      - name: Install packages
        # run: sudo pip install boman-cli
        run: sudo pip install --extra-index-url https://test.pypi.org/simple/ boman-cli-uat==15.6.11
      - name: Run scan
        # run: sudo boman-cli -a run -u https://qa.boman.ai/
        run: sudo boman-cli-uat -a run -u https://qa.boman.ai
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: boman_opengrep.json
